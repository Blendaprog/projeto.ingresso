<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Criar Conta — TicketShow</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

    <style>
        /* CSS específico — cadastro usuário */
        .cadastro-page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 50px 20px;
            background:
                radial-gradient(circle at 80% 15%, rgba(59, 130, 246, 0.16), transparent 38%),
                radial-gradient(circle at 15% 85%, rgba(139, 92, 246, 0.12), transparent 38%),
                var(--bg);
        }

        .cadastro-card {
            width: 100%;
            max-width: 560px;
            padding: 40px 38px;
            background: var(--surface);
            border: 1px solid var(--border-strong);
            border-radius: var(--radius-xl);
            box-shadow: var(--shadow-lg), var(--glow-primary);
            animation: cardIn 0.5s ease both;
            position: relative;
            overflow: hidden;
        }

        .cadastro-card::before {
            content: "";
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 3px;
            background: linear-gradient(90deg, var(--primary), var(--violet), var(--primary));
            background-size: 200% 100%;
            animation: lineMove 4s linear infinite;
        }

        @keyframes lineMove {
            0%   { background-position: 0% 0; }
            100% { background-position: 200% 0; }
        }

        @keyframes cardIn {
            from { opacity: 0; transform: translateY(18px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        /* Logo */
        .cadastro-logo {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 24px;
            color: #fff;
            font-size: 18px;
            font-weight: 850;
            text-decoration: none;
            transition: transform var(--t);
        }

        .cadastro-logo:hover {
            transform: translateY(-1px);
            color: #fff;
        }

        /* Título */
        .cadastro-header {
            margin-bottom: 26px;
        }

        .cadastro-header h1 {
            margin: 0 0 6px;
            color: #fff;
            font-size: 28px;
            font-weight: 900;
            letter-spacing: -0.8px;
        }

        .cadastro-header p {
            margin: 0;
            color: var(--text-muted);
            font-size: 14px;
        }

        /* Inputs */
        .cadastro-form-group {
            margin-bottom: 14px;
        }

        .cadastro-form-group label {
            display: block;
            margin-bottom: 6px;
            color: var(--text-soft);
            font-size: 13px;
            font-weight: 650;
        }

        .cadastro-form-group input,
        .cadastro-form-group select {
            width: 100%;
            min-height: 46px;
            padding: 11px 15px;
            background: var(--bg-alt);
            border: 1px solid var(--border-strong);
            border-radius: 10px;
            color: #fff;
            font-size: 14px;
            font-family: inherit;
            outline: none;
            transition: all var(--t);
        }

        .cadastro-form-group input::placeholder {
            color: var(--text-dim);
        }

        .cadastro-form-group input:focus,
        .cadastro-form-group select:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.15);
        }

        .cadastro-form-group select {
            appearance: none;
            background-image: url("data:image/svg+xml,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16' fill='%2394a3b8'%3e%3cpath d='M8 11L3 6h10z'/%3e%3c/svg%3e");
            background-repeat: no-repeat;
            background-position: right 14px center;
            background-size: 14px;
            padding-right: 40px;
        }

        .cadastro-form-group select option {
            background: var(--surface-2);
            color: #fff;
        }

        /* Grid 2 colunas */
        .cadastro-grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px;
        }

        /* Divisor */
        .cadastro-divisor {
            margin: 22px 0;
            border: 0;
            border-top: 1px solid var(--border);
        }

        /* Foto de perfil */
        .foto-label {
            display: block;
            margin-bottom: 12px;
            color: var(--text-soft);
            font-size: 13px;
            font-weight: 650;
        }

        .foto-opcoes {
            display: flex;
            gap: 10px;
            margin-bottom: 12px;
        }

        .foto-opcao {
            flex: 1;
            position: relative;
        }

        .foto-opcao input[type="radio"] {
            position: absolute;
            opacity: 0;
            pointer-events: none;
        }

        .foto-opcao label {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 7px;
            padding: 11px 14px;
            background: var(--surface-2);
            border: 1px solid var(--border-strong);
            border-radius: 10px;
            color: var(--text-muted);
            font-size: 13px;
            font-weight: 650;
            cursor: pointer;
            transition: all var(--t);
        }

        .foto-opcao label:hover {
            border-color: var(--primary);
            color: var(--text-soft);
        }

        .foto-opcao input[type="radio"]:checked + label {
            background: rgba(59, 130, 246, 0.12);
            border-color: var(--primary);
            color: #fff;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.12);
        }

        #campoFoto {
            margin-top: 10px;
            animation: fadeIn 0.3s ease;
        }

        #campoFoto input[type="file"] {
            width: 100%;
            padding: 12px 14px;
            background: var(--bg-alt);
            border: 1px dashed var(--border-strong);
            border-radius: 10px;
            color: var(--text-muted);
            font-size: 12px;
            font-family: inherit;
            cursor: pointer;
            transition: all var(--t);
        }

        #campoFoto input[type="file"]:hover {
            border-color: var(--primary);
            color: var(--text-soft);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-4px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        /* Botão principal */
        .cadastro-submit {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            min-height: 48px;
            margin-top: 22px;
            padding: 12px 20px;
            background: linear-gradient(135deg, var(--primary) 0%, var(--violet) 100%);
            border: 0;
            border-radius: 11px;
            color: #fff;
            font-size: 14px;
            font-weight: 800;
            font-family: inherit;
            letter-spacing: 0.3px;
            cursor: pointer;
            box-shadow: 0 10px 28px rgba(59, 130, 246, 0.30);
            transition: all var(--t);
        }

        .cadastro-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 15px 38px rgba(59, 130, 246, 0.50);
        }

        /* Link voltar */
        .cadastro-voltar {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
            margin-top: 22px;
            padding: 22px 0 0;
            border-top: 1px solid var(--border);
            color: var(--text-muted);
            font-size: 13px;
            font-weight: 600;
            text-decoration: none;
            transition: color var(--t);
        }

        .cadastro-voltar:hover {
            color: #fff;
        }

        @media (max-width: 520px) {
            .cadastro-card { padding: 30px 22px; }
            .cadastro-grid-2 { grid-template-columns: 1fr; }
        }
    </style>
</head>

<body class="pagina-home">

<main class="cadastro-page">

    <div class="cadastro-card">

        <!-- Logo -->
        <a href="/" class="cadastro-logo">
            <span class="brand-ticket-icon">T</span>
            <span>TicketShow</span>
        </a>

        <!-- Título -->
        <div class="cadastro-header">
            <h1>Criar sua conta</h1>
            <p>Preencha os dados para começar a comprar ingressos.</p>
        </div>

        <!-- FORM -->
        <form action="/salvar_usuario" method="POST" enctype="multipart/form-data" autocomplete="off">

            <div class="cadastro-form-group">
                <label for="nome">Nome completo</label>
                <input type="text"
                       id="nome"
                       name="nome"
                       placeholder="Seu nome"
                       required
                       autofocus>
            </div>

            <div class="cadastro-form-group">
                <label for="email">E-mail</label>
                <input type="email"
                       id="email"
                       name="email"
                       placeholder="seu@email.com"
                       required>
            </div>

            <div class="cadastro-form-group">
                <label for="senha">Senha</label>
                <input type="password"
                       id="senha"
                       name="senha"
                       placeholder="Crie uma senha (mínimo 6 caracteres)"
                       minlength="6"
                       required>
            </div>

            <div class="cadastro-grid-2">

                <div class="cadastro-form-group">
                    <label for="data_nascimento">Data de nascimento</label>
                    <input type="date"
                           id="data_nascimento"
                           name="data_nascimento"
                           required>
                </div>

                <div class="cadastro-form-group">
                    <label for="genero">Gênero</label>
                    <select id="genero" name="genero" required>
                        <option value="">Selecione</option>
                        <option value="Feminino">Feminino</option>
                        <option value="Masculino">Masculino</option>
                        <option value="Outro">Outro</option>
                        <option value="Prefiro não informar">Prefiro não informar</option>
                    </select>
                </div>

            </div>

            <hr class="cadastro-divisor">

            <span class="foto-label">📷 Deseja adicionar uma foto de perfil?</span>

            <div class="foto-opcoes">

                <div class="foto-opcao">
                    <input type="radio"
                           id="foto-sim"
                           name="adicionar_foto"
                           value="sim"
                           onclick="mostrarCampo()">
                    <label for="foto-sim">
                        ✓ Sim
                    </label>
                </div>

                <div class="foto-opcao">
                    <input type="radio"
                           id="foto-nao"
                           name="adicionar_foto"
                           value="nao"
                           onclick="esconderCampo()"
                           checked>
                    <label for="foto-nao">
                        ✕ Não
                    </label>
                </div>

            </div>

            <div id="campoFoto" style="display:none;">
                <input type="file"
                       name="foto"
                       accept="image/*">
            </div>

            <button type="submit" class="cadastro-submit">
                ✨ Criar minha conta
            </button>

        </form>

        <a href="/login" class="cadastro-voltar">
            ← Já tenho conta, fazer login
        </a>

    </div>

</main>

<script>
function mostrarCampo() {
    document.getElementById("campoFoto").style.display = "block";
}

function esconderCampo() {
    document.getElementById("campoFoto").style.display = "none";
}
</script>

</body>

</html>
