<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Criar conta | TicketShow</title><link rel="stylesheet" href="{{ url_for('static',filename='ticketshow-auth.css') }}"></head><body class="ts-auth"><header class="auth-header"><a href="{{ url_for('login') }}" class="auth-logo">Ticket<span>Show</span></a><a class="auth-back" href="{{ url_for('login') }}">← Voltar para o login</a></header><main class="auth-layout"><section class="auth-promo"><span class="auth-promo-tag">TICKETSHOW · CADASTRO</span><h1>Sua próxima experiência está a um clique.</h1><p>Crie sua conta para conferir shows, explorar categorias e organizar seus ingressos em um lugar só.</p><div class="auth-promo-photo"></div></section><section class="auth-form-panel"><div class="auth-form-inner"><span class="auth-eyebrow">NOVA CONTA</span><h2>Crie sua conta</h2><p>Preencha seus dados para começar.</p><form method="post" action="{{ url_for('salvar_usuario') }}" enctype="multipart/form-data"><label for="nome">Nome completo</label><input id="nome" name="nome" type="text" placeholder="Seu nome" required autocomplete="name"><label for="email">E-mail</label><input id="email" name="email" type="email" placeholder="seuemail@exemplo.com" required autocomplete="email"><label for="senha">Senha</label><input id="senha" name="senha" type="password" minlength="8" placeholder="Mínimo de 8 caracteres" required autocomplete="new-password"><div class="auth-inline-fields"><div><label for="nascimento">Data de nascimento</label><input id="nascimento" name="data_nascimento" type="date" required></div><div><label for="genero">Gênero</label><select id="genero" name="genero"><option value="">Selecione</option><option>Feminino</option><option>Masculino</option><option>Prefiro não informar</option></select></div></div><label for="adicionar_foto">Foto de perfil (opcional)</label><select id="adicionar_foto" name="adicionar_foto"><option value="nao">Não adicionar agora</option><option value="sim">Quero adicionar</option></select><div id="campoFoto" hidden><label for="foto">Selecione uma imagem</label><input type="file" id="foto" name="foto" accept="image/png,image/jpeg,image/webp"></div><button class="auth-primary" type="submit">Criar minha conta →</button></form><p class="auth-form-footer">Já tem uma conta? <a href="{{ url_for('login') }}">Entrar</a></p></div></section></main><script>document.getElementById('adicionar_foto').addEventListener('change',function(){document.getElementById('campoFoto').hidden=this.value!=='sim'});</script></body></html>
