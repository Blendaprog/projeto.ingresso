<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro - TicketShow</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-dark">

<div class="container mt-5">

    <div class="row justify-content-center">

        <div class="col-md-6">

            <div class="card shadow">

                <div class="card-header text-center">
                    <h2>Criar Conta</h2>
                </div>

                <div class="card-body">

                    <!-- FORM ÚNICO (CORRETO) -->
                    <form action="/salvar_usuario" method="POST" enctype="multipart/form-data">

                        <div class="mb-3">
                            <label>Nome Completo</label>
                            <input type="text" name="nome" class="form-control" required>
                        </div>

                        <div class="mb-3">
                            <label>Email</label>
                            <input type="email" name="email" class="form-control" required>
                        </div>

                        <div class="mb-3">
                            <label>Senha</label>
                            <input type="password" name="senha" class="form-control" required>
                        </div>

                        <div class="mb-3">
                            <label>Data de Nascimento</label>
                            <input type="date" name="data_nascimento" class="form-control" required>
                        </div>

                        <div class="mb-3">
                            <label>Gênero</label>
                            <select name="genero" class="form-select" required>
                                <option value="">Selecione</option>
                                <option>Feminino</option>
                                <option>Masculino</option>
                                <option>Prefiro não informar</option>
                            </select>
                        </div>

                        <hr>

                        <label>Deseja adicionar uma foto de perfil?</label><br>

                        <input type="radio" name="adicionar_foto" value="sim" onclick="mostrarCampo()">
                        Sim

                        <input type="radio" name="adicionar_foto" value="nao" onclick="esconderCampo()" checked>
                        Não

                        <div id="campoFoto" style="display:none; margin-top:10px;">
                            <input type="file" name="foto" class="form-control" accept="image/*">
                        </div>

                        <br>

                        <button type="submit" class="btn btn-success w-100">
                            Cadastrar
                        </button>

                    </form>

                    <hr>

                    <a href="/login" class="btn btn-secondary w-100">
                        Voltar para Login
                    </a>

                </div>

            </div>

        </div>

    </div>

</div>

<script>
function mostrarCampo() {
    document.getElementById("campoFoto").style.display = "block";
}

function esconderCampo() {
    document.getElementById("campoFoto").style.display = "none";
}
</script>

</body>
</html>
