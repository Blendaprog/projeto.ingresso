<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Cadastro de Administrador</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-5">

    <div class="card shadow p-4 mx-auto" style="max-width:500px;">

        <h2 class="text-center mb-4">Cadastro de Administrador</h2>

        <form action="/salvar_adm" method="POST">

            <input type="text" class="form-control mb-3" name="nome" placeholder="Nome" required>

            <input type="email" class="form-control mb-3" name="email" placeholder="E-mail" required>

            <input type="password" class="form-control mb-3" name="senha" placeholder="Senha" required>

            <input type="date" class="form-control mb-3" name="data_nascimento" required>

            <select class="form-control mb-3" name="genero">
                <option value="Masculino">Masculino</option>
                <option value="Feminino">Feminino</option>
                <option value="Outro">Outro</option>
            </select>

            <button class="btn btn-success w-100">
                Cadastrar
            </button>

        </form>

    </div>

</div>

</body>
</html>
