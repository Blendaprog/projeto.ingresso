<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Cadastrar Show</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-dark text-white">

<div class="container mt-5">

    <h1 class="text-center">Cadastrar Show</h1>

    <form method="POST">

        <input type="text" name="nome" class="form-control mb-3" placeholder="Nome do Show" required>

        <input type="text" name="categoria" class="form-control mb-3" placeholder="Categoria" required>

        <input type="text" name="local" class="form-control mb-3" placeholder="Local" required>

        <input type="date" name="data" class="form-control mb-3" required>

        <input type="number" name="idade_minima" class="form-control mb-3" placeholder="Idade mínima" required>

        <input type="number" name="preco" class="form-control mb-3" placeholder="Preço" required>

        <button type="submit" class="btn btn-success w-100">
            Cadastrar
        </button>
        <label>Nome da imagem</label>

            <input
                type="text"
                name="imagem"
                class="form-control"
                placeholder="ex: veigh.png"
                required>

                </form>

</div>

</body>
</html>
