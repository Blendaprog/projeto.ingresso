<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login Admin — TicketShow</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

    <style>
        /* CSS específico — página de login admin */
        .admin-login-page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
            background:
                radial-gradient(circle at 80% 15%, rgba(139, 92, 246, 0.18), transparent 38%),
                radial-gradient(circle at 15% 85%, rgba(59, 130, 246, 0.14), transparent 38%),
                var(--bg);
        }

        .admin-login-card {
            width: 100%;
            max-width: 440px;
            padding: 42px 36px;
            background: var(--surface);
            border: 1px solid rgba(139, 92, 246, 0.35);
            border-radius: var(--radius-xl);
            box-shadow:
                var(--shadow-lg),
                0 0 45px rgba(139, 92, 246, 0.18);
            animation: adminCardIn 0.5s ease both;
            position: relative;
            overflow: hidden;
        }

        .admin-login-card::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(90deg, var(--violet), var(--primary), var(--violet));
            background-size: 200% 100%;
            animation: lineMove 4s linear infinite;
        }

        @keyframes lineMove {
            0%   { background-position: 0% 0; }
            100% { background-position: 200% 0; }
        }

        @keyframes adminCardIn {
            from { opacity: 0; transform: translateY(20px) scale(0.98); }
            to   { opacity: 1; transform: translateY(0) scale(1); }
        }

        /* Badge de admin no topo */
        .admin-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 7px 14px;
            margin-bottom: 22px;
            background: rgba(139, 92, 246, 0.12);
            border: 1px solid rgba(139, 92, 246, 0.4);
            border-radius: 30px;
            color: #c4b5fd;
            font-size: 10px;
            font-weight: 850;
            letter-spacing: 1.8px;
            text-transform: uppercase;
        }

        .admin-badge::before {
            content: "";
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: var(--violet);
            box-shadow: 0 0 12px rgba(139, 92, 246, 0.9);
            animation: pulse-dot 1.8s ease-in-out infinite;
        }

        .admin-login-card h1 {
            margin: 0 0 8px;
            color: #fff;
            font-size: 28px;
            font-weight: 900;
            letter-spacing: -0.8px;
        }

        .admin-login-card > p {
            margin: 0 0 28px;
            color: var(--text-muted);
            font-size: 14px;
        }

        /* Inputs */
        .admin-form-group {
            margin-bottom: 16px;
        }

        .admin-form-group label {
            display: block;
            margin-bottom: 7px;
            color: var(--text-soft);
            font-size: 13px;
            font-weight: 650;
        }

        .admin-form-group input {
            width: 100%;
            min-height: 48px;
            padding: 12px 16px;
            background: var(--bg-alt);
            border: 1px solid var(--border-strong);
            border-radius: 10px;
            color: #fff;
            font-size: 14px;
            font-family: inherit;
            outline: none;
            transition: all var(--t);
        }

        .admin-form-group input::placeholder {
            color: var(--text-dim);
        }

        .admin-form-group input:focus {
            border-color: var(--violet);
            box-shadow: 0 0 0 4px rgba(139, 92, 246, 0.15);
        }

        /* Botão */
        .admin-submit {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            min-height: 48px;
            margin-top: 8px;
            padding: 12px 20px;
            background: linear-gradient(135deg, var(--violet) 0%, var(--primary) 100%);
            border: 0;
            border-radius: 11px;
            color: #fff;
            font-size: 14px;
            font-weight: 800;
            font-family: inherit;
            letter-spacing: 0.3px;
            cursor: pointer;
            box-shadow: 0 10px 28px rgba(139, 92, 246, 0.35);
            transition: all var(--t);
        }

        .admin-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 15px 38px rgba(139, 92, 246, 0.55);
        }

        .admin-submit:active {
            transform: translateY(0);
        }

        /* Link voltar */
        .admin-back {
            display: block;
            margin-top: 22px;
            padding-top: 22px;
            border-top: 1px solid var(--border);
            color: var(--text-muted);
            font-size: 13px;
            font-weight: 600;
            text-align: center;
            transition: color var(--t);
        }

        .admin-back:hover {
            color: #fff;
        }

        /* Erro */
        .admin-error {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            margin-bottom: 20px;
            padding: 13px 15px;
            background: rgba(239, 68, 68, 0.10);
            border: 1px solid rgba(239, 68, 68, 0.32);
            border-radius: 10px;
            color: #fca5a5;
            font-size: 13px;
            line-height: 1.5;
            animation: shake 0.4s ease;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25%      { transform: translateX(-6px); }
            75%      { transform: translateX(6px); }
        }

        .admin-error span:first-child {
            font-size: 16px;
            flex-shrink: 0;
        }

        /* Logo acima do form */
        .admin-logo {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 28px;
            color: #fff;
            font-size: 18px;
            font-weight: 850;
            text-decoration: none;
            transition: transform var(--t);
        }

        .admin-logo:hover {
            transform: translateY(-1px);
            color: #fff;
        }
    </style>
</head>

<body class="pagina-home">

<main class="admin-login-page">

    <div class="admin-login-card">

        <!-- Logo -->
        <a href="/" class="admin-logo">
            <span class="brand-ticket-icon">T</span>
            <span>TicketShow</span>
        </a>

        <!-- Badge -->
        <div class="admin-badge">
            Painel administrativo
        </div>

        <h1>Acesso restrito</h1>
        <p>Entre com suas credenciais de administrador.</p>

        {% if erro %}
            <div class="admin-error">
                <span>⚠️</span>
                <span>{{ erro }}</span>
            </div>
        {% endif %}

        <form method="POST" autocomplete="off">

            <div class="admin-form-group">
                <label for="email">E-mail administrativo</label>
                <input type="email"
                       id="email"
                       name="email"
                       placeholder="admin@ticketshow.com"
                       required
                       autofocus>
            </div>

            <div class="admin-form-group">
                <label for="senha">Senha</label>
                <input type="password"
                       id="senha"
                       name="senha"
                       placeholder="Digite sua senha"
                       required>
            </div>

            <button type="submit" class="admin-submit">
                🔐 Entrar no painel
            </button>

        </form>

        <a href="/login" class="admin-back">
            ← Voltar para login de usuário
        </a>

    </div>

</main>

</body>
</html>
