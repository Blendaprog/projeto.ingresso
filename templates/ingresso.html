<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Meu Ingresso</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-dark text-white">

<div class="container mt-5">

    <div class="card text-center">

        <div class="card-header bg-success text-white">
            🎟️ INGRESSO CONFIRMADO
        </div>

        <div class="card-body">

            <h2>{{ ingresso.show }}</h2>

            <p><strong>Local:</strong> {{ ingresso.local }}</p>
            <p><strong>Data:</strong> {{ ingresso.data }}</p>
            <p><strong>Pagamento:</strong> {{ ingresso.pagamento }}</p>
            <p><strong>Valor:</strong> R$ {{ ingresso.preco }}</p>

            <hr>

            <h4>Código do ingresso:</h4>
            <h3 class="text-warning">{{ ingresso.codigo }}</h3>

        </div>

        <div class="card-footer">
            <a href="/" class="btn btn-light">
                Voltar para shows
            </a>
        </div>

    </div>

</div>

</body>
</html>
