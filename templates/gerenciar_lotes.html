```html
<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Gerenciar Lotes</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='style.css') }}"
    >
</head>

<body>

    <div class="container mt-5">

        <h1>Gerenciar Lotes</h1>

        <h3>{{ show["nome"] }}</h3>

        <form method="POST">

            {% for lote in show["lotes"] %}

            <div class="card p-3 mb-3">

                <h4>{{ lote["nome"] }}</h4>

                <div class="mb-3">
                    <label>Quantidade de ingressos</label>

                    <input
                        type="number"
                        name="quantidade_{{ loop.index0 }}"
                        value="{{ lote['quantidade'] }}"
                        class="form-control"
                        min="0"
                        required
                    >
                </div>

                <div class="mb-3">
                    <label>Preço</label>

                    <input
                        type="number"
                        name="preco_{{ loop.index0 }}"
                        value="{{ lote['preco'] }}"
                        class="form-control"
                        min="0"
                        step="0.01"
                        required
                    >
                </div>

            </div>

            {% endfor %}

            <button type="submit" class="btn btn-primary">
                Salvar alterações
            </button>

            <a
                href="{{ url_for('meus_shows') }}"
                class="btn btn-secondary"
            >
                Voltar
            </a>

        </form>

    </div>

</body>

</html>
```
