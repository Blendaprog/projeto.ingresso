<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <title>Pagamento PIX</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<div class="pix-container">

  <div class="pix-card">

    <h2>💳 Pagamento via PIX</h2>

    <p>Escaneie o QR Code abaixo para pagar seu ingresso</p>

    <img 
      src="https://api.qrserver.com/v1/create-qr-code/?size=250x250&data=PIX"
      alt="QR Code PIX"
    >

    <hr style="border-color: rgba(255,255,255,0.2);">

    <p><strong>🎤 Show:</strong> {{ show }}</p>
    <p><strong>💰 Valor:</strong> R$ {{ preco }}</p>

    <div class="pix-code">
      {{ codigo }}
    </div>

    <button class="pix-btn" onclick="copiarPix()">
      📋 Copiar código PIX
    </button>

    <a href="{{ url_for('home') }}" class="btn btn-outline-light w-100 mt-3">
      ⬅ Voltar
    </a>

  </div>

</div>

<script>
function copiarPix() {
  const pix = "{{ codigo }}";
  navigator.clipboard.writeText(pix);
  alert("Código PIX copiado com sucesso!");
}
</script>

</body>
</html>
