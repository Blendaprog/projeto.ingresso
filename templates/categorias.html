<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Categorias</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #0f172a, #111827);
            color: #e5e7eb;
        }

        .container-box {
            margin-top: 80px;
            text-align: center;
        }

        h1 {
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 35px;
            letter-spacing: 1px;
        }

        .btn-cat {
            display: block;
            width: 100%;
            max-width: 340px;
            margin: 12px auto;
            padding: 15px;
            border-radius: 12px;

            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.1);

            color: #e5e7eb;
            font-weight: 600;
            font-size: 16px;
            text-decoration: none;

            transition: all 0.25s ease;
            backdrop-filter: blur(8px);
        }

        .btn-cat:hover {
            transform: translateY(-3px);
            background: rgba(255, 255, 255, 0.12);
            border-color: rgba(255, 255, 255, 0.25);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
            color: #ffffff;
        }

        .title {
            font-size: 32px;
            font-weight: bold;
        }

        .back-btn {
            margin-top: 30px;
            display: inline-block;
            padding: 12px 22px;
            border-radius: 10px;

            background: #2563eb;
            color: white;
            text-decoration: none;
            font-weight: 600;

            transition: 0.2s;
        }

        .back-btn:hover {
            background: #1d4ed8;
            transform: scale(1.05);
        }
    </style>
</head>

<body>

<div class="container container-box">

    <h1 class="title">Categorias</h1>

    <a href="/categoria/rap" class="btn-cat"> Rap</a>
    <a href="/categoria/funk" class="btn-cat"> Funk</a>
    <a href="/categoria/trap" class="btn-cat"> Trap</a>
    <a href="/categoria/pop" class="btn-cat"> Pop</a>
    <a href="/categoria/r&b" class="btn-cat"> R&B</a>
    <a href="/categoria/mpb" class="btn-cat"> MPB</a>
    <a href="/categoria/K-Pop" class="btn-cat"> K-Pop</a>


    <a href="{{ url_for('home') }}" class="back-btn">⬅ Voltar</a>

</div>

</body>
</html>
