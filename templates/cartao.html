<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Pagamento | TicketShow</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='style.css') }}"
    >
</head>

<body>

    <div class="container py-5">

        <div class="row justify-content-center">

            <div class="col-lg-7 col-md-9">

                <div class="card shadow-lg border-0">

                    <div class="card-body p-4 p-md-5">

                        <!-- TÍTULO -->

                        <div class="text-center mb-4">

                            <div style="font-size: 42px;">
                                💳
                            </div>

                            <h2 class="fw-bold mt-2">
                                Pagamento com cartão
                            </h2>

                            <p class="text-muted mb-0">
                                Preencha os dados para finalizar sua compra.
                            </p>

                        </div>


                        <!-- RESUMO DA COMPRA -->

                        <div class="alert alert-primary border-0 rounded-3 mb-4">

                            <div class="d-flex justify-content-between align-items-center">

                                <div>

                                    <small class="text-muted">
                                        Seu ingresso
                                    </small>

                                    <h5 class="fw-bold mb-0">
                                        {{ show }}
                                    </h5>

                                </div>

                                <div class="text-end">

                                    <small class="text-muted">
                                        Total
                                    </small>

                                    <h4 class="fw-bold mb-0">
                                        R$ {{ "%.2f"|format(preco) }}
                                    </h4>

                                </div>

                            </div>

                        </div>


                        <!-- FORMULÁRIO -->

                        <form
                            action="{{ url_for('pagar_cartao_novo') }}"
                            method="POST"
                        >

                            <input
                                type="hidden"
                                name="show"
                                value="{{ show }}"
                            >

                            <input
                                type="hidden"
                                name="local"
                                value="{{ local }}"
                            >

                            <input
                                type="hidden"
                                name="data"
                                value="{{ data }}"
                            >

                            <input
                                type="hidden"
                                name="preco"
                                value="{{ preco }}"
                            >

                            <input
                                type="hidden"
                                name="codigo"
                                value="{{ codigo }}"
                            >


                            <!-- TIPO DO CARTÃO -->

                            <div class="mb-4">

                                <label class="form-label fw-semibold">
                                    Tipo de cartão
                                </label>

                                <div class="row g-2">

                                    <div class="col-6">

                                        <input
                                            type="radio"
                                            class="btn-check"
                                            name="tipo_cartao"
                                            id="debito"
                                            value="Débito"
                                            required
                                            onchange="mostrarParcelas()"
                                        >

                                        <label
                                            class="btn btn-outline-primary w-100 py-3"
                                            for="debito"
                                        >
                                            💳 Débito
                                        </label>

                                    </div>

                                    <div class="col-6">

                                        <input
                                            type="radio"
                                            class="btn-check"
                                            name="tipo_cartao"
                                            id="credito"
                                            value="Crédito"
                                            onchange="mostrarParcelas()"
                                        >

                                        <label
                                            class="btn btn-outline-primary w-100 py-3"
                                            for="credito"
                                        >
                                            💳 Crédito
                                        </label>

                                    </div>

                                </div>

                            </div>


                            <!-- BANCO -->

                            <div class="mb-4">

                                <label
                                    for="banco"
                                    class="form-label fw-semibold"
                                >
                                    Banco do cartão
                                </label>

                                <select
                                    name="banco"
                                    id="banco"
                                    class="form-select"
                                    required
                                >

                                    <option value="">
                                        Selecione seu banco
                                    </option>

                                    <option value="Nubank">
                                        Nubank
                                    </option>

                                    <option value="Itaú">
                                        Itaú
                                    </option>

                                    <option value="Bradesco">
                                        Bradesco
                                    </option>

                                    <option value="Santander">
                                        Santander
                                    </option>

                                    <option value="Banco do Brasil">
                                        Banco do Brasil
                                    </option>

                                    <option value="Caixa">
                                        Caixa Econômica Federal
                                    </option>

                                    <option value="Inter">
                                        Banco Inter
                                    </option>

                                    <option value="C6 Bank">
                                        C6 Bank
                                    </option>

                                    <option value="BTG Pactual">
                                        BTG Pactual
                                    </option>

                                    <option value="Outro">
                                        Outro
                                    </option>

                                </select>

                            </div>


                            <!-- NÚMERO -->

                            <div class="mb-4">

                                <label
                                    for="numero"
                                    class="form-label fw-semibold"
                                >
                                    Número do cartão
                                </label>

                                <input
                                    type="text"
                                    name="numero"
                                    id="numero"
                                    class="form-control"
                                    placeholder="0000 0000 0000 0000"
                                    maxlength="19"
                                    inputmode="numeric"
                                    autocomplete="cc-number"
                                    required
                                >

                            </div>


                            <!-- NOME -->

                            <div class="mb-4">

                                <label
                                    for="nome"
                                    class="form-label fw-semibold"
                                >
                                    Nome no cartão
                                </label>

                                <input
                                    type="text"
                                    name="nome"
                                    id="nome"
                                    class="form-control"
                                    placeholder="Nome completo"
                                    autocomplete="cc-name"
                                    required
                                >

                            </div>


                            <!-- VALIDADE E CVV -->

                            <div class="row">

                                <div class="col-md-6 mb-4">

                                    <label
                                        for="validade"
                                        class="form-label fw-semibold"
                                    >
                                        Validade
                                    </label>

                                    <input
                                        type="text"
                                        name="validade"
                                        id="validade"
                                        class="form-control"
                                        placeholder="MM/AA"
                                        maxlength="5"
                                        inputmode="numeric"
                                        autocomplete="cc-exp"
                                        required
                                    >

                                </div>


                                <div class="col-md-6 mb-4">

                                    <label
                                        for="cvv"
                                        class="form-label fw-semibold"
                                    >
                                        CVV
                                    </label>

                                    <input
                                        type="password"
                                        name="cvv"
                                        id="cvv"
                                        class="form-control"
                                        placeholder="123"
                                        maxlength="4"
                                        inputmode="numeric"
                                        autocomplete="cc-csc"
                                        required
                                    >

                                </div>

                            </div>


                            <!-- PARCELAMENTO -->

                            <div
                                class="mb-4"
                                id="parcelasArea"
                                style="display: none;"
                            >

                                <label
                                    for="parcelas"
                                    class="form-label fw-semibold"
                                >
                                    Número de parcelas
                                </label>

                                <select
                                    name="parcelas"
                                    id="parcelas"
                                    class="form-select"
                                >

                                    <option value="1">
                                        1x sem juros
                                    </option>

                                    <option value="2">
                                        2x sem juros
                                    </option>

                                    <option value="3">
                                        3x sem juros
                                    </option>

                                    <option value="4">
                                        4x sem juros
                                    </option>

                                    <option value="5">
                                        5x sem juros
                                    </option>

                                    <option value="6">
                                        6x sem juros
                                    </option>

                                </select>

                            </div>


                            <!-- BOTÃO -->

                            <button
                                type="submit"
                                class="btn btn-primary w-100 py-3 fw-bold"
                            >
                                Finalizar pagamento
                                <br>
                                <span>
                                    R$ {{ "%.2f"|format(preco) }}
                                </span>
                            </button>


                            <p class="text-center text-muted small mt-3 mb-0">
                                🔒 Pagamento seguro e protegido.
                            </p>

                        </form>

                    </div>

                </div>

            </div>

        </div>

    </div>


    <script>

        // MOSTRA OU ESCONDE PARCELAS

        function mostrarParcelas() {

            const credito =
                document.getElementById("credito");

            const parcelasArea =
                document.getElementById("parcelasArea");

            if (credito.checked) {

                parcelasArea.style.display = "block";

            } else {

                parcelasArea.style.display = "none";

            }

        }


        // FORMATA NÚMERO DO CARTÃO

        document
            .getElementById("numero")
            .addEventListener("input", function () {

                let valor = this.value
                    .replace(/\D/g, "")
                    .substring(0, 16);

                valor = valor.replace(
                    /(\d{4})(?=\d)/g,
                    "$1 "
                );

                this.value = valor;

            });


        // FORMATA VALIDADE

        document
            .getElementById("validade")
            .addEventListener("input", function () {

                let valor = this.value
                    .replace(/\D/g, "")
                    .substring(0, 4);

                if (valor.length > 2) {

                    valor =
                        valor.substring(0, 2)
                        + "/"
                        + valor.substring(2);

                }

                this.value = valor;

            });


        // PERMITE APENAS NÚMEROS NO CVV

        document
            .getElementById("cvv")
            .addEventListener("input", function () {

                this.value =
                    this.value
                    .replace(/\D/g, "")
                    .substring(0, 4);

            });

    </script>

</body>

</html>
