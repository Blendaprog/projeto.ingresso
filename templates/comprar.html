<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Comprar Ingresso</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: linear-gradient(135deg, #0f172a, #111827);
            color: white;
        }

        .card {
            background: rgba(255,255,255,0.06);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 16px;
            backdrop-filter: blur(10px);
            color: white;
        }

        .text-success {
            color: #22c55e !important;
        }

        .form-select,
        .form-control {
            background: rgba(255,255,255,0.1);
            color: white;
            border: 1px solid rgba(255,255,255,0.2);
        }

        .form-select option {
            color: black;
        }

        .btn-success {
            background: #2563eb;
            border: none;
        }

        .btn-success:hover {
            background: #1d4ed8;
        }

        .btn-secondary {
            background: rgba(255,255,255,0.1);
            border: none;
        }

        .btn-secondary:hover {
            background: rgba(255,255,255,0.2);
        }

        #pixArea,
        #cartaoArea {
            display: none;
        }
    </style>

</head>


<body>

<div class="container mt-5">

    <div class="row justify-content-center">

        <div class="col-md-6">

            <div class="card shadow p-4">


                <h2 class="text-center mb-4">
                    🎟 Comprar Ingresso
                </h2>


                <h3>
                    {{ show.nome }}
                </h3>


                <p>
                    <strong>Local:</strong> {{ show.local }}
                </p>


                <p>
                    <strong>Data:</strong> {{ show.data }}
                </p>


                <p>
                    <strong>Categoria:</strong> {{ show.categoria }}
                </p>


                <hr>


                <h5>
                    Preço do ingresso:
                </h5>


                <h4 class="text-success">
                    R$ {{ show.preco }}
                </h4>


                <hr>



                <form action="/finalizar_compra" method="POST">


                    <input type="hidden" name="show" value="{{ show.nome }}">

                    <input type="hidden" name="local" value="{{ show.local }}">

                    <input type="hidden" name="data" value="{{ show.data }}">

                    <input type="hidden" name="preco" value="{{ show.preco }}">



                    <div class="mb-3">

                        <label class="form-label">
                            Forma de Pagamento
                        </label>


                        <select 
                            name="pagamento" 
                            id="pagamento" 
                            class="form-select"
                            onchange="mostrarPagamento()"
                            required>


                            <option value="">
                                Selecione
                            </option>


                            <option value="PIX">
                                PIX
                            </option>


                            <option value="CARTAO">
                                Cartão
                            </option>


                        </select>

                    </div>



                    <!-- PIX -->

                    <div id="pixArea" class="text-center mt-3">


                        <h5>
                            Pagamento via PIX
                        </h5>


                        <p>
                            Após finalizar a compra será confirmado o pagamento.
                        </p>


                    </div>



                    <!-- CARTÃO -->

                    <div id="cartaoArea">


                        <input 
                        type="text" 
                        class="form-control mb-2"
                        placeholder="Número do cartão">


                        <input 
                        type="text" 
                        class="form-control mb-2"
                        placeholder="Nome no cartão">


                        <input 
                        type="text" 
                        class="form-control mb-2"
                        placeholder="Validade MM/AA">


                        <input 
                        type="text" 
                        class="form-control mb-2"
                        placeholder="CVV">


                    </div>




                    <button 
                    type="submit" 
                    class="btn btn-success w-100 mt-4">

                        Finalizar Compra

                    </button>


                </form>




                <a href="/" class="btn btn-secondary w-100 mt-3">

                    Voltar

                </a>



            </div>

        </div>

    </div>

</div>




<script>

function mostrarPagamento() {


    let pagamento = document.getElementById("pagamento").value;


    document.getElementById("pixArea").style.display = "none";

    document.getElementById("cartaoArea").style.display = "none";



    if (pagamento === "PIX") {

        document.getElementById("pixArea").style.display = "block";

    }



    if (pagamento === "CARTAO") {

        document.getElementById("cartaoArea").style.display = "block";

    }


}

</script>



</body>

</html>
