<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Comprar Ingresso</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<div class="container mt-5">

    <div class="row justify-content-center">

        <div class="col-md-6">

            <div class="card shadow">

                <div class="card-header text-center">
                    <h2>Confirmar Compra</h2>
                </div>

                <div class="card-body">

                    <h3>{{ show.nome }}</h3>

                    <p>
                        <strong>Local:</strong>
                        {{ show.local }}
                    </p>

                    <p>
                        <strong>Data:</strong>
                        {{ show.data }}
                    </p>

                    <p>
                        <strong>Categoria:</strong>
                        {{ show.categoria }}
                    </p>

                    <p>
                        <strong>Idade mínima:</strong>
                        {{ show.idade_minima }} anos
                    </p>

                    <h4 class="text-success">
                        R$ {{ show.preco }}
                    </h4>

                    <hr>

                    <form action="/finalizar_compra" method="POST">

                        <input type="hidden" name="show" value="{{ show.nome }}">
                        <input type="hidden" name="preco" value="{{ show.preco }}">
                        <input type="hidden" name="local" value="{{ show.local }}">
                        <input type="hidden" name="data" value="{{ show.data }}">

                        <div class="mb-3">

                            <label class="form-label">
                                Forma de Pagamento
                            </label>

                            <select
                                name="pagamento"
                                id="pagamento"
                                class="form-select"
                                onchange="mostrarPagamento()"
                                required>

                                <option value="">
                                    Selecione
                                </option>

                                <option value="PIX">
                                    PIX
                                </option>

                                <option value="Cartão de Crédito">
                                    Cartão de Crédito
                                </option>

                                <option value="Cartão de Débito">
                                    Cartão de Débito
                                </option>

                            </select>

                        </div>

                        <!-- PIX -->

                        <div id="pixArea"
                             style="display:none;"
                             class="mt-3 text-center">

                            <h5>Pagamento via PIX</h5>

                            <img
                                src="{{ url_for('static', filename='img/pix_qrcode.png') }}"
                                width="250">

                            <p class="mt-2">
                                Chave PIX: ticketshow@email.com
                            </p>

                        </div>

                        <!-- CARTÃO -->

                        <div id="cartaoArea"
                             style="display:none;"
                             class="mt-3">

                            <label>Número do Cartão</label>
                            <input
                                type="text"
                                name="numero_cartao"
                                class="form-control mb-2">

                            <label>Nome no Cartão</label>
                            <input
                                type="text"
                                name="nome_cartao"
                                class="form-control mb-2">

                            <label>Validade</label>
                            <input
                                type="text"
                                name="validade"
                                class="form-control mb-2"
                                placeholder="MM/AA">

                            <label>CVV</label>
                            <input
                                type="text"
                                name="cvv"
                                class="form-control">

                        </div>

                        <button
                            type="submit"
                            class="btn btn-success w-100 mt-4">

                            Finalizar Compra

                        </button>

                    </form>

                    <hr>

                    <a href="/"
                    class="btn btn-secondary w-100">

                        Voltar

                    </a>
                     <h2>Comprar Ingresso</h2>

                    <form method="POST" action="/finalizar_compra">
                        <input name="show_nome" placeholder="Nome do show">
                        <button type="submit">Comprar</button>
                    </form>
                </div>

            </div>

        </div>

    </div>

</div>

<script>

function mostrarPagamento() {

    let pagamento =
        document.getElementById("pagamento").value;

    let pix =
        document.getElementById("pixArea");

    let cartao =
        document.getElementById("cartaoArea");

    pix.style.display = "none";
    cartao.style.display = "none";

    if (pagamento == "PIX") {
        pix.style.display = "block";
    }

    if (
        pagamento == "Cartão de Crédito" ||
        pagamento == "Cartão de Débito"
    ) {
        cartao.style.display = "block";
    }
}

</script>

</body>
</html>
